name: Deploy DEV

on:
  push:
    branches:
      - dev_brach_env2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/standup-backend:dev ./standup-comedy-app/server
          docker push ${{ secrets.DOCKER_USERNAME }}/standup-backend:dev

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/standup-frontend:dev ./standup-comedy-app/client
          docker push ${{ secrets.DOCKER_USERNAME }}/standup-frontend:dev

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.VPS_PATH_DEV }}

            echo "---- Pull latest images ----"
            docker pull ${{ secrets.DOCKER_USERNAME }}/standup-backend:dev
            docker pull ${{ secrets.DOCKER_USERNAME }}/standup-frontend:dev

            echo "---- Stop old containers ----"
            docker compose down --remove-orphans

            echo "---- Start containers ----"
            docker compose up -d

            echo "✅ Déploiement terminé"
            docker ps
